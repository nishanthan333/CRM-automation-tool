[project]
name = "crm-watchdog"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["crm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
